<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DayToDay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #03045e;
      color: #caf0f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #00b4d8;
      letter-spacing: -1px;
    }

    .tagline {
      color: #90e0ef;
      margin-top: 0.5rem;
      font-size: 1rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 2.5rem;
    }

    .links a {
      display: block;
      padding: 0.9rem 1.5rem;
      border: 1px solid #0077b6;
      border-radius: 10px;
      color: #caf0f8;
      text-decoration: none;
      font-size: 0.95rem;
      transition: background 0.15s, border-color 0.15s;
    }

    .links a:hover {
      background: rgba(0, 180, 216, 0.1);
      border-color: #00b4d8;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #0096c7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>DayToDay</h1>
    <p class="tagline">Wellness reminders for iPhone &amp; Mac</p>

    <div class="links">
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy Policy</a>
    </div>

    <footer>&copy; 2026 DayToDay</footer>
  </div>
</body>
</html>
